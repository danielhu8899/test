<style>

.bar{fill:var(--fg)}.hot{fill:var(--hot)}
.rel li{margin:3px 0}.pr{font-size:.85rem;color:var(--mut);white-space:pre-wrap;margin:0}
ul{padding-left:1.1rem;margin:4px 0}

.ov.on{display:flex}

.md table{border-collapse:collapse;width:100%}.md td{border-top:1px solid var(--line);padding:5px 4px;font-size:.92rem}.md td:first-child{color:var(--mut);white-space:nowrap;width:5.5em}
.hide{display:none}.tb{width:100%;border-collapse:collapse;font-size:.88rem}.tb th,.tb td{border-top:1px solid var(--line);padding:5px 4px;text-align:center;white-space:nowrap}.tb th{color:var(--mut);font-weight:400}.ox{overflow-x:auto;margin-top:8px}.tg{font-size:.78rem;color:var(--hot)}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.yg{display:grid;gap:4px 6px;font-size:.85rem}.ye{padding:2px 4px;border-radius:4px;white-space:nowrap}.ye.v{background:#b3261e;color:#fff}.ye.c{background:#3d6fa8;color:#fff}.ye.h{background:#3f8f4a;color:#fff}.st{font-size:.95rem;margin:12px 0 4px;color:var(--acc);font-weight:700}

<svg id="bg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><filter id="pp" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .24  0 0 0 0 .15  .9 0 0 0 -.28"/></filter><filter id="bl" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="5"/></filter><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6d9ba"/><stop offset=".5" stop-color="#f2eadb"/><stop offset="1" stop-color="#e4d9bf"/></linearGradient><linearGradient id="ms" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4ecd9" stop-opacity="0"/><stop offset=".5" stop-color="#f4ecd9" stop-opacity=".95"/><stop offset="1" stop-color="#f4ecd9" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1200" fill="url(#sk)"/><circle cx="620" cy="200" r="60" fill="#b3261e" opacity=".5" filter="url(#bl)"/><path d="M0 760L60 700 110 735 190 640 250 710 330 600 410 700 470 650 560 730 640 620 720 700 800 660V1200H0Z" fill="#8a989e" opacity=".3" filter="url(#bl)"/><rect y="700" width="800" height="100" fill="url(#ms)"/><path d="M0 870L80 780 150 835 240 720 330 825 420 750 520 845 620 740 720 825 800 780V1200H0Z" fill="#5a696f" opacity=".42" filter="url(#bl)"/><rect y="820" width="800" height="100" fill="url(#ms)"/><path d="M0 1010L70 935 140 980 230 890 320 975 400 935 500 1005 610 910 700 975 800 935V1200H0Z" fill="#2c383d" opacity=".6"/><rect y="960" width="800" height="110" fill="url(#ms)" opacity=".7"/><ellipse cx="200" cy="470" rx="230" ry="26" fill="#fff" opacity=".4" filter="url(#bl)"/><ellipse cx="620" cy="570" rx="250" ry="30" fill="#fff" opacity=".4" filter="url(#bl)"/><path d="M-10 90Q80 110 140 170T262 252M92 130Q132 120 172 90M150 176Q192 190 216 232" stroke="#2b2118" stroke-width="5" fill="none" stroke-linecap="round" opacity=".75"/><g fill="#b3261e" opacity=".8"><circle cx="172" cy="92" r="9"/><circle cx="146" cy="108" r="7"/><circle cx="216" cy="232" r="8"/><circle cx="262" cy="252" r="9"/><circle cx="108" cy="150" r="6"/><circle cx="190" cy="190" r="6"/></g><rect width="800" height="1200" fill="#000" filter="url(#pp)"/></svg>
<main>
<h1>☯ 梅花易數</h1><div class="sub">— 起卦排盤 —</div>
<div class="card">
  <h2>起卦設定</h2><label>起卦時間（台灣時間 UTC+8，可自行修改）</label>
  <div class="row"><input type="datetime-local" id="dt"><button class="sm" id="now" style="flex:0 0 auto">現在</button></div>
  <div id="pv" class="meta" style="margin-top:6px"></div>
  <div class="tabs" style="margin-top:12px">
    <button data-m="time" class="on">時間起卦</button><button data-m="num">數字起卦</button><button data-m="hand">手動指定</button><button data-m="cu">自訂卦例</button>
  </div>
  <div id="p-time"></div>
  <div id="p-num" class="hide">
    <div class="row"><div><label>第一組數字（上卦）</label><input type="number" id="n1" min="1" value=""></div><div><label>第二組數字（下卦）</label><input type="number" id="n2" min="1" value=""></div></div>
    <button class="sm" id="rnd" style="margin-top:8px">電腦亂數產生</button>
  </div>
  <div id="p-hand" class="hide">
    <div class="row"><div><label>上卦</label><select id="hu"></select></div><div><label>下卦</label><select id="hl"></select></div></div>
    <label>動爻</label>
    <select id="hm"><option value="a">自動（上卦數＋下卦數＋時支數 ÷6）</option><option value="0">無動爻（靜卦）</option><option value="1">初爻</option><option value="2">二爻</option><option value="3">三爻</option><option value="4">四爻</option><option value="5">五爻</option><option value="6">上爻</option></select>
  </div>
  <div id="p-cu" class="hide"><p class="meta">時間日期使用上方的起卦時間，四柱自動換算。以下自行選擇各卦上下卦，卦名與五行即時對應。</p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cauto" checked style="width:auto">依本卦與動爻自動推算互卦、變卦（直接改互卦或變卦，會自動切換為手動）</label><label>動爻</label><select id="cm"><option value="0">無動爻（靜卦）</option><option value="1" selected>初爻</option><option value="2">二爻</option><option value="3">三爻</option><option value="4">四爻</option><option value="5">五爻</option><option value="6">上爻</option></select><div id="cgrp"></div></div>
  
  <button class="go" id="go">起卦</button>
</div>
<div id="out"></div>
<div class="card"><h2>八卦萬物類象</h2><div id="xg" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px"></div><p class="meta" style="margin-bottom:0">點選八卦查看類象，也可寫下個人補充筆記。排盤畫面中點上卦、下卦同樣可開啟。</p></div>
<p class="meta">原型：僅計算排盤與五行關係，不判斷吉凶。四柱與農曆使用 lunar-javascript 曆法套件，年柱以立春、月柱以節為界，精確到分鐘；晚子時日柱算當天。</p>
</main>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
<script>
const Z='子丑寅卯辰巳午未申酉戌亥';
const K=['五行','陰陽','先天數','後天方位','自然','人物','身體','動物','性質','顏色'];
const T=[
{n:'乾',e:'金',l:[1,1,1],d:['金','陽','1','西北','天','父親·長者·君主·領導者','頭','馬','剛健·主動','大赤·玄色']},
{n:'兌',e:'金',l:[1,1,0],d:['金','陰','2','正西','澤','少女·巫·歌妓','口·肺','羊','喜悅·口舌','白色']},
{n:'離',e:'火',l:[1,0,1],d:['火','陰','3','正南','火·日·電','中女·文人','目·心','雉','文明·附麗','紅·紫']},
{n:'震',e:'木',l:[1,0,0],d:['木','陽','4','正東','雷','長男','足·肝','龍','動·起·怒','青·碧·綠']},
{n:'巽',e:'木',l:[0,1,1],d:['木','陰','5','東南','風','長女·僧尼','股·膽','雞','入·順','青·綠·白']},
{n:'坎',e:'水',l:[0,1,0],d:['水','陽','6','正北','水·雨·雪','中男·盜賊·舟人','耳·血·腎','豕','陷·險·勞','黑色']},
{n:'艮',e:'土',l:[0,0,1],d:['土','陽','7','東北','山','少男·閒人·童子','手·鼻·背','狗','止·靜·阻','黃色']},
{n:'坤',e:'土',l:[0,0,0],d:['土','陰','8','西南','地','母·老婦·眾人','腹·脾胃','牛','柔順·吝嗇·眾','黃·黑']}];
const NAME=[
'乾為天,天澤履,天火同人,天雷無妄,天風姤,天水訟,天山遯,天地否',
'澤天夬,兌為澤,澤火革,澤雷隨,澤風大過,澤水困,澤山咸,澤地萃',
'火天大有,火澤睽,離為火,火雷噬嗑,火風鼎,火水未濟,火山旅,火地晉',
'雷天大壯,雷澤歸妹,雷火豐,震為雷,雷風恆,雷水解,雷山小過,雷地豫',
'風天小畜,風澤中孚,風火家人,風雷益,巽為風,風水渙,風山漸,風地觀',
'水天需,水澤節,水火既濟,水雷屯,水風井,坎為水,水山蹇,水地比',
'山天大畜,山澤損,山火賁,山雷頤,山風蠱,山水蒙,艮為山,山地剝',
'地天泰,地澤臨,地火明夷,地雷復,地風升,地水師,地山謙,坤為地'].map(s=>s.split(','));
const NO=[[1,10,13,25,44,6,33,12],[43,58,49,17,28,47,31,45],[14,38,30,21,50,64,56,35],[34,54,55,51,32,40,62,16],[9,61,37,42,57,59,53,20],[5,60,63,3,48,29,39,8],[26,41,22,27,18,4,52,23],[11,19,36,24,46,7,15,2]];
const GEN={木:'火',火:'土',土:'金',金:'水',水:'木'},KE={木:'土',土:'水',水:'火',火:'金',金:'木'};
const $=i=>document.getElementById(i);
const m8=s=>s%8||8, m6=s=>s%6||6;
const key=l=>l.join('');
const triIdx=l=>T.findIndex(t=>key(t.l)===key(l));
function rel(a,b,lb){const x=T[a].e,y=T[b].e;
 if(x===y)return `體${T[a].n}（${x}）與${lb}（${y}）：比和`;
 if(GEN[x]===y)return `體${T[a].n}（${x}）生${lb}（${y}）：體生${lb}`;
 if(GEN[y]===x)return `${lb}（${y}）生體${T[a].n}（${x}）：${lb}生體`;
 if(KE[x]===y)return `體${T[a].n}（${x}）剋${lb}（${y}）：體剋${lb}`;
 return `${lb}（${y}）剋體${T[a].n}（${x}）：${lb}剋體`;}
function svg(lines,mk,tag){let s='<svg class="h" viewBox="0 0 120 88">';
 for(let n=6;n>=1;n--){const y=(6-n)*14+3,hot=n===mk,c=hot?'hot':'bar',v=lines[n-1];
  s+=v?`<rect class="${c}" x="8" y="${y}" width="80" height="9" rx="2"/>`:`<rect class="${c}" x="8" y="${y}" width="35" height="9" rx="2"/><rect class="${c}" x="53" y="${y}" width="35" height="9" rx="2"/>`;
  if(hot)s+=`<text x="94" y="${y+9}" font-size="11" class="hot">${tag}</text>`;}
 return s+'</svg>';}
function hexCard(title,lines,mk,tag){const lo=triIdx(lines.slice(0,3)),up=triIdx(lines.slice(3));
 return `<div class="hc"><h3>${title}</h3><button class="nm" onclick="showHex(${up},${lo})">${NAME[up][lo]}</button><div class="meta">第${NO[up][lo]}卦</div>${svg(lines,mk,tag)}<button class="tr" onclick="showTri(${up})">上 ${T[up].n}（${T[up].e}）</button><button class="tr" onclick="showTri(${lo})">下 ${T[lo].n}（${T[lo].e}）</button><div class="meta" style="margin-top:4px">先天數 ${up+1}＋${lo+1}＝<b>${up+lo+2}</b></div></div>`;}
function showTri(i){const t=T[i];$('md').innerHTML=`<h2>${t.n}卦 類象</h2><table>${K.map((k,j)=>`<tr><td>${k}</td><td>${t.d[j]}</td></tr>`).join('')}</table><p class="meta">來源：說卦傳及梅花易數常見類象（初版，個人補充功能將於第二階段加入）。</p><button class="sm" onclick="closeM()">關閉</button>`;$('ov').classList.add('on');}
function showHex(u,l){$('md').innerHTML=`<h2>${NAME[u][l]}（第${NO[u][l]}卦）</h2><p>上卦：${T[u].n}（${T[u].e}）　下卦：${T[l].n}（${T[l].e}）</p>${yjHtml(NO[u][l],[...T[l].l,...T[u].l])}<button class="sm" onclick="closeM()">關閉</button>`;$('ov').classList.add('on');}
function closeM(){$('ov').classList.remove('on')}
$('ov').onclick=e=>{if(e.target.id==='ov')closeM()};
function fill(sel){sel.innerHTML=T.map((t,i)=>`<option value="${i+1}">${t.n}（${t.e}）${i+1}</option>`).join('')}
fill($('hu'));fill($('hl'));
const nowTW=()=>new Date(Date.now()+8*36e5).toISOString().slice(0,16);
$('dt').value=nowTW();$('now').onclick=()=>$('dt').value=nowTW();
let mode='time';
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['time','num','hand','cu'].forEach(m=>$('p-'+m).classList.toggle('hide',m!==mode))});
$('rnd').onclick=()=>{$('n1').value=1+Math.floor(Math.random()*999);$('n2').value=1+Math.floor(Math.random()*999)};
$('go').onclick=run;
const CG=[['b','本卦'],['h','互卦'],['c','變卦']];
$('cgrp').innerHTML=CG.map(([k,n])=>`<div class="card" style="margin:8px 0 0;padding:8px"><b>${n}</b><div class="row"><div><label>上卦</label><select id="c${k}u"></select></div><div><label>下卦</label><select id="c${k}l"></select></div></div><div class="meta" id="c${k}d"></div></div>`).join('');
CG.forEach(([k])=>{fill($('c'+k+'u'));fill($('c'+k+'l'))});
const cuVal=k=>[+$('c'+k+'u').value-1,+$('c'+k+'l').value-1];
function updateCu(){const auto=$('cauto').checked,m=+$('cm').value;
 if(auto){const [U,L]=cuVal('b'),ln=[...T[L].l,...T[U].l],bl=ln.slice();if(m)bl[m-1]=bl[m-1]?0:1;
  $('chu').value=triIdx([ln[2],ln[3],ln[4]])+1;$('chl').value=triIdx([ln[1],ln[2],ln[3]])+1;$('ccu').value=triIdx(bl.slice(3))+1;$('ccl').value=triIdx(bl.slice(0,3))+1}
 
 CG.forEach(([k])=>{const [u,l]=cuVal(k);$('c'+k+'d').innerHTML=`<b>${NAME[u][l]}</b>（第${NO[u][l]}卦）　上${T[u].n}（${T[u].e}）・下${T[l].n}（${T[l].e}）`})}
['cbu','cbl','cm','cauto'].forEach(i=>$(i).onchange=updateCu);['chu','chl','ccu','ccl'].forEach(i=>$(i).onchange=()=>{$('cauto').checked=false;updateCu()});updateCu();
function cuPrep(){updateCu();const [bu,bl_]=cuVal('b'),m=+$('cm').value,[hu_,hl_]=cuVal('h'),[cu_,cl_]=cuVal('c'),ln=[...T[bl_].l,...T[bu].l],dc=ln.slice();if(m)dc[m-1]=dc[m-1]?0:1;
 const ok=triIdx([ln[1],ln[2],ln[3]])===hl_&&triIdx([ln[2],ln[3],ln[4]])===hu_&&triIdx(dc.slice(3))===cu_&&triIdx(dc.slice(0,3))===cl_;

const YJ={
1:'元亨利貞。|大哉乾元，萬物資始，乃統天。雲行雨施，品物流形，大明終始，六位時成，時乘六龍以御天。乾道變化，各正性命，保合大和，乃利貞。首出庶物，萬國咸寧。|天行健，君子以自強不息。|潛龍勿用。|潛龍勿用，陽在下也。|見龍在田，利見大人。|見龍在田，德施普也。|君子終日乾乾，夕惕若厲，旡咎。|終日乾乾，反復道也。|或躍在淵，旡咎。|或躍在淵，進无咎也。|飛龍在天，利見大人。|飛龍在天，大人造也。|亢龍有悔。|亢龍有悔，盈不可久也。|見群龍旡首，吉。|用九，天德不可為首也。',
2:'元亨，利牝馬之貞。君子有攸往，先迷，後得，主利，西南得朋，東北喪朋，安貞吉。|至哉坤元，萬物資生，乃順承天。坤厚載物，德合无疆，含弘光大，品物咸亨。牝馬地類，行地无疆。柔順利貞，君子攸行，先迷失道，後順得常。西南得朋，乃與類行，東北喪朋，乃終有慶，安貞之吉，應地无疆。|地勢坤，君子以厚德載物。|履霜，堅冰至。|履霜堅冰，陰始凝也。馴致其道，至堅冰也。|直方大，不習无不利。|六二之動，直以方也。不習无不利，地道光也。|含章可貞，或從王事，无成有終。|含章可貞，以時發也；或從王事，知光大也。|括囊，无咎无譽。|括囊无咎，慎不害也。|黃裳，元吉。|黃裳元吉，文在中也。|龍戰于野，其血玄黃。|龍戰于野，其道窮也。|利永貞。|用六永貞，以大終也。',
3:'元亨，利貞。勿用有攸往，利建侯。|屯，剛柔始交而難生，動乎險中，大亨，貞。雷雨之動，滿盈。天造草昧，宜建侯而不寧。|雲雷，屯。君子以經綸。|磐桓，利居貞，利建侯。|雖磐桓，志行正也。以貴下賤，大得民也。|屯如邅如，乘馬班如，匪寇婚媾，女子貞不字，十年乃字。|六二之難，乘剛也。十年乃字，反常也。|即鹿无虞，惟入于林中。君子幾，不如舍。往吝。|即鹿无虞，以從禽也，君子舍之，往吝窮也。|乘馬班如，求婚媾，往吉无不利。|求而往，明也。|屯其膏，小貞吉，大貞凶。|屯其膏，施未光也。|乘馬班如，泣血漣如。|泣血漣如，何可長也。',
4:'亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。|蒙，山下有險，險而止，蒙。蒙，亨，以亨行，時中也。匪我求童蒙，童蒙求我，志應也。初筮告，以剛中也。再三瀆，瀆則不告，瀆蒙也。蒙以養正，聖功也。|山下出泉，蒙。君子以果行育德。|發蒙。利用刑人，用說桎梏，以往吝。|利用刑人，以正法也。|包蒙，吉。納婦吉，子克家。|子克家，剛柔節也。|勿用取女，見金夫，不有躬，无攸利。|勿用取女，行不順也。|困蒙，吝。|困蒙之吝，獨遠實也。|童蒙，吉。|童蒙之吉，順以巽也。|擊蒙，不利為寇，利禦寇。|利用禦寇，上下順也。',
5:'有孚，光亨，貞吉，利涉大川。|需，須也，險在前也。剛健而不陷，其義不困窮矣。需，有孚，光亨，貞吉，位乎天位，以正中也。利涉大川，往有功也。|雲上於天，需，君子以飲食宴樂。|需于郊，利用恆，无咎。|需于郊，不犯難行也。利用恆，无咎，未失常也。|需于沙，小有言，終吉。|需于沙，衍在中也，雖小有言，以終吉也。|需于泥，致寇至。|需于泥，災在外也。自我致寇，敬慎不敗也。|需于血，出自穴。|需于血，順以聽也。|需于酒食，貞吉。|酒食，貞吉，以中正也。|入于穴，有不速之客三人來，敬之，終吉。|不速之客來，敬之終吉，雖不當位，未大失也。',
6:'有孚，窒惕，中吉，終凶。利見大人，不利涉大川。|訟，上剛下險，險而健。訟，訟有孚，窒惕，中吉，剛來而得中也。終凶，訟不可成也。利見大人，尚中正也。不利涉大川，入于淵也。|天與水違行，訟。君子以作事謀始。|不永所事，小有言，終吉。|不永所事，訟不可長也，雖小有言，其辯明也。|不克訟，歸而逋，其邑人三百戶，无眚。|不克訟，歸逋，竄也。自下訟上，患至掇也。|食舊德，貞厲，終吉，或從王事，无成。|食舊德，從上吉也。|不克訟，復即命，渝安貞，吉。|復即命，渝安貞，不失也。|訟，元吉。|訟元吉，以中正也。|或錫之鞶帶，終朝三褫之。|以訟受服，亦不足敬也。',
7:'貞丈人，吉，无咎。|師，眾也，貞，正也，能以眾正，可以王矣。剛中而應，行險而順，以此毒天下，而民從之，吉又何咎矣。|地中有水，師，君子以容民畜眾。|師出以律，否臧，凶。|師出以律，失律，凶也。|在師中，吉，无咎，王三錫命。|在師中吉，承天寵也；王三錫命，懷萬邦也。|師或輿尸，凶。|師或輿尸，大无功也。|師左次，无咎。|左次无咎，未失常也。|田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。|長子帥師，以中行也；弟子輿尸，使不當也。|大君有命，開國承家，小人勿用。|大君有命，以正功也；小人勿用，必亂邦也。',
8:'吉。原筮，元永貞，无咎。不寧方來，後夫凶。|比，吉也。比，輔也，下順從也。原筮，元永貞，无咎，以剛中也。不寧方來，上下應也。後夫凶，其道窮也。|地上有水，比。先王以建萬國，親諸侯。|有孚，比之无咎。有孚盈缶，終來，有它吉。|比之初六，有它吉也。|比之自內，貞吉。|比之自內，不自失也。|比之匪人。|比之匪人，不亦傷乎。|外比之，貞吉。|外比於賢，以從上也。|顯比，王用三驅，失前禽，邑人不誡，吉。|顯比之吉，位正中也；舍逆取順，失前禽也；邑人不誡，上使中也。|比之无首，凶。|比之无首，无所終也。',
9:'亨。密雲不雨，自我西郊。|小畜，柔得位而上下應之，曰小畜。健而巽，剛中而志行，乃亨。密雲不雨，尚往也；自我西郊，施未行也。|風行天上，小畜，君子以懿文德。|復自道，何其咎，吉。|復自道，其義吉也。|牽復，吉。|牽復在中，亦不自失也。|輿說輻，夫妻反目。|夫妻反目，不能正室也。|有孚，血去惕出，无咎。|有孚惕出，上合志也。|有孚攣如，富以其鄰。|有孚攣如，不獨富也。|既雨既處，尚德載，婦貞厲。月幾望，君子征凶。|既雨既處，德積載也；君子征凶，有所疑也。',
10:'履虎尾，不咥人，亨。|履，柔履剛也。說而應乎乾，是以履虎尾，不咥人，亨。剛中正，履帝位而不疚，光明也。|上天下澤，履，君子以辯上下，定民志。|素履，往，无咎。|素履之往，獨行願也。|履道坦坦，幽人貞吉。|幽人貞吉，中不自亂也。|眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。|眇能視，不足以有明也；跛能履，不足以與行也；咥人之凶，位不當也；武人為于大君，志剛也。|履虎尾，愬愬，終吉。|愬愬，終吉，志行也。|夬履，貞厲。|夬履，貞厲，位正當也。|視履，考祥其旋，元吉。|元吉在上，大有慶也。',
11:'小往大來，吉亨。|泰，小往大來，吉亨，則是天地交而萬物通也，上下交而其志同也。內陽而外陰，內健而外順，內君子而外小人。君子道長，小人道消也。|天地交，泰。后以財成天地之道，輔相天地之宜，以左右民。|拔茅茹，以其彙，征吉。|拔茅征吉，志在外也。|包荒，用馮河，不遐遺，朋亡，得尚于中行。|包荒，得尚于中行，以光大也。|无平不陂，无往不復。艱貞，无咎。勿恤其孚，于食有福。|无往不復，天地際也。|翩翩不富，以其鄰，不戒以孚。|翩翩不富，皆失實也；不戒以孚，中心願也。|帝乙歸妹，以祉，元吉。|以祉元吉，中以行願也。|城復于隍，勿用師。自邑告命，貞吝。|城復于隍，其命亂也。',
12:'否之匪人，不利君子貞，大往小來。|否之匪人，不利君子貞，大往小來，則是天地不交而萬物不通也，上下不交而天下无邦也。內陰而外陽，內柔而外剛，內小人而外君子，小人道長，君子道消也。|天地不交，否。君子以儉德辟難，不可榮以祿。|拔茅茹，以其彙，貞吉，亨。|拔茅貞吉，志在君也。|包承，小人吉，大人否亨。|大人否亨，不亂群也。|包羞。|包羞，位不當也。|有命无咎，疇離祉。|有命无咎，志行也。|休否，大人吉，其亡其亡，繫于苞桑。|大人之吉，位正當也。|傾否，先否後喜。|否終則傾，何可長也。',
13:'同人于野，亨。利涉大川，利君子貞。|同人，柔得位得中而應乎乾，曰同人。同人曰，同人于野，亨，利涉大川，乾行也。文明以健，中正而應，君子正也，唯君子為能通天下之志。|天與火，同人。君子以類族辨物。|同人于門，无咎。|出門同人，又誰咎也。|同人于宗，吝。|同人于宗，吝道也。|伏戎于莽，升其高陵，三歲不興。|伏戎于莽，敵剛也；三歲不興，安行也。|乘其墉，弗克攻，吉。|乘其墉，義弗克也。其吉，則困而反則也。|同人，先號咷而後笑，大師克，相遇。|同人之先，以中直也；大師相遇，言相克也。|同人于郊，无悔。|同人于郊，志未得也。',
14:'元亨。|大有，柔得尊位大中，而上下應之，曰大有。其德剛健而文明，應乎天而時行，是以元亨。|火在天上，大有。君子以遏惡揚善，順天休命。|无交害，匪咎，艱則无咎。|大有初九，无交害也。|大車以載，有攸往，无咎。|大車以載，積中不敗也。|公用亨于天子，小人弗克。|公用亨于天子，小人害也。|匪其彭，无咎。|匪其彭，无咎，明辨晢也。|厥孚交如，威如，吉。|厥孚交如，信以發志也；威如之吉，易而无備也。|自天祐之，吉，无不利。|大有上吉，自天祐也。',
15:'亨，君子有終。|謙亨，天道下濟而光明，地道卑而上行；天道虧盈而益謙，地道變盈而流謙；鬼神害盈而福謙，人道惡盈而好謙。謙尊而光，卑而不可踰，君子之終也。|地中有山，謙，君子以裒多益寡，稱物平施。|謙謙君子，用涉大川，吉。|謙謙君子，卑以自牧也。|鳴謙，貞吉。|鳴謙貞吉，中心得也。|勞謙，君子有終，吉。|勞謙君子，萬民服也。|无不利，撝謙。|无不利，撝謙，不違則也。|不富以其鄰，利用侵伐，无不利。|利用侵伐，征不服也。|鳴謙，利用行師，征邑國。|鳴謙，志未得也，可用行師，征邑國也。',
16:'利建侯，行師。|豫，剛應而志行，順以動，豫。豫順以動，故天地如之，而況建侯行師乎？天地以順動，故日月不過，而四時不忒。聖人以順動，則刑罰清而民服。豫之時義大矣哉。|雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。|鳴豫，凶。|初六鳴豫，志窮凶也。|介于石，不終日，貞吉。|不終日，貞吉，以中正也。|盱豫，悔，遲有悔。|盱豫有悔，位不當也。|由豫，大有得。勿疑，朋盍簪。|由豫，大有得，志大行也。|貞疾，恒不死。|六五，貞疾，乘剛也；恒不死，中未亡也。|冥豫成，有渝，无咎。|冥豫在上，何可長也。',
17:'元亨，利貞，无咎。|隨，剛來而下柔，動而說，隨。大亨，貞，无咎，而天下隨時，隨時之義大矣哉。|澤中有雷，隨。君子以嚮晦入宴息。|官有渝，貞吉。出門交，有功。|官有渝，從正吉也；出門交有功，不失也。|係小子，失丈夫。|係小子，弗兼與也。|係丈夫，失小子。隨有求得，利居貞。|係丈夫，志舍下也。|隨有獲，貞凶。有孚在道，以明，何咎？|隨有獲，其義凶也；有孚在道，明功也。|孚于嘉，吉。|孚于嘉吉，位正中也。|拘係之乃從維之，王用亨于西山。|拘係之。上窮也。',
18:'元亨，利涉大川。先甲三日，後甲三日。|蠱，剛上而柔下，巽而止，蠱。蠱元亨，而天下治也；利涉大川，往有事也；先甲三日，後甲三日，終則有始，天行也。|山下有風，蠱。君子以振民育德。|幹父之蠱。有子，考无咎，厲，終吉。|幹父之蠱，意承考也。|幹母之蠱，不可貞。|幹母之蠱，得中道也。|幹父之蠱，小有悔，无大咎。|幹父之蠱，終无咎也。|裕父之蠱，往見吝。|裕父之蠱，往未得也。|幹父之蠱，用譽。|幹父用譽，承以德也。|不事王侯，高尚其事。|不事王侯，志可則也。',
19:'元亨，利貞，至于八月有凶。|臨，剛浸而長，說而順，剛中而應，大亨以正，天之道也；至于八月有凶，消不久也。|澤上有地，臨。君子以教思无窮，容保民无疆。|咸臨，貞吉。|咸臨貞吉，志行正也。|咸臨，吉，无不利。|咸臨吉无不利，未順命也。|甘臨，无攸利，既憂之，无咎。|甘臨，位不當也，既憂之，咎不長也。|至臨，无咎。|至臨无咎，位當也。|知臨，大君之宜，吉。|大君之宜，行中之謂也。|敦臨，吉，无咎。|敦臨之吉，志在內也。',
20:'盥而不薦，有孚顒若。|大觀在上，順而巽，中正以觀天下。觀盥而不薦，有孚顒若，下觀而化也。觀天之神道，而四時不忒，聖人以神道設教，而天下服矣。|風行地上，觀，先王以省方，觀民設教。|童觀，小人无咎，君子吝。|初六童觀，小人道也。|闚觀，利女貞。|闚觀女貞，亦可醜也。|觀我生，進退。|觀我生進退，未失道也。|觀國之光，利用賓于王。|觀國之光，尚賓也。|觀我生，君子无咎。|觀我生，觀民也。|觀其生，君子无咎。|觀其生，志未平也。',
21:'亨，利用獄。|頤中有物，曰噬嗑。噬嗑而亨，剛柔分動而明，雷電合而章，柔得中而上行，雖不當位，利用獄也。|雷電，噬嗑，先王以明罰敕法。|屨校滅趾，无咎。|屨校滅趾，不行也。|噬膚，滅鼻，无咎。|噬膚滅鼻，乘剛也。|噬腊肉，遇毒。小吝，无咎。|遇毒，位不當也。|噬乾胏，得金矢，利艱貞吉。|利艱貞吉，未光也。|噬乾肉，得黃金，貞厲，无咎。|貞厲无咎，得當也。|何校滅耳，凶。|何校滅耳，聰不明也。',
22:'亨，小利有攸往。|賁亨。柔來而文剛，故亨。分剛上而文柔，故小利有攸往。天文也，文明以止，人文也。觀乎天文，以察時變，觀乎人文，以化成天下。|山下有火，賁。君子以明庶政，无敢折獄。|賁其趾，舍車而徒。|舍車而徒，義弗乘也。|賁其須。|賁其須，與上興也。|賁如濡如，永貞吉。|永貞之吉，終莫之陵也。|賁如皤如，白馬翰如，匪寇婚媾。|六四當位，疑也；匪寇婚媾，終无尤也。|賁于丘園，束帛戔戔。吝，終吉。|六五之吉，有喜也。|白賁，无咎。|白賁无咎，上得志也。',
23:'不利有攸往。|剝，剝也，柔變剛也。不利有攸往，小人長也。順而止之，觀象也。君子尚消息盈虛，天行也。|山附于地，剝。上以厚下安宅。|剝床以足，蔑貞，凶。|剝床以足，以滅下也。|剝床以辨，蔑貞，凶。|剝床以辨，未有與也。|剝之无咎。|剝之无咎，失上下也。|剝床以膚，凶。|剝床以膚，切近災也。|貫魚，以宮人寵，无不利。|以宮人寵，終无尤也。|碩果不食，君子得輿，小人剝廬。|君子得輿，民所載也，小人剝廬，終不可用也。',
24:'亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往。|復，亨。剛反，動而以順行，是以出入无疾，朋來无咎，反復其道，七日來復，天行也。利有攸往，剛長也。復其見天地之心乎。|雷在地中，復，先王以至日閉關，商旅不行，后不省方。|不遠復，无祇悔，元吉。|不遠之復，以脩身也。|休復，吉。|休復之吉，以下仁也。|頻復，厲，无咎。|頻復之厲，義无咎也。|中行獨復。|中行獨復，以從道也。|敦復，无悔。|敦復无悔，中以自考也。|迷復，凶，有災眚，用行師，終有大敗。以其國君，凶。至于十年不克征。|迷復之凶，反君道也。',
25:'元亨，利貞。其匪正，有眚，不利有攸往。|无妄，剛自外來而為主於內，動而健，剛中而應，大亨以正，天之命也，其匪正有眚，不利有攸往。无妄之往，何之矣。天命不祐，行矣哉。|天下雷行，物與无妄。先王以茂，對時育萬物。|无妄往，吉。|无妄之往，得志也。|不耕穫，不菑畬，則利有攸往。|不耕穫，未富也。|无妄之災，或繫之牛，行人之得，邑人之災。|行人得牛，邑人災也。|可貞，无咎。|可貞无咎，固有之也。|无妄之疾，勿藥，有喜。|无妄之藥，不可試也。|无妄行，有眚，无攸利。|无妄之行，窮之災也。',
26:'利貞，不家食，吉，利涉大川。|大畜，剛健篤實，輝光日新，其德，剛上而尚賢，能止健，大正也。不家食吉，養賢也；利涉大川，應乎天也。|天在山中，大畜。君子以多識前言往行，以畜其德。|有厲，利已。|有厲利已，不犯災也。|輿說輹。|輿說輹，中无尤也。|良馬逐，利艱貞。曰閑輿衛，利有攸往。|利有攸往，上合志也。|童牛之牿，元吉。|六四元吉，有喜也。|豶豕之牙，吉。|六五之吉，有慶也。|何天之衢亨。|何天之衢，道大行也。',
27:'貞吉，觀頤，自求口實。|頤，貞吉，養正則吉也。觀頤，觀其所養也；自求口實，觀其自養也。天地養萬物，聖人養賢以及萬民，頤之時大矣哉。|山下有雷，頤，君子以慎言語，節飲食。|舍爾靈龜，觀我朵頤，凶。|觀我朵頤，亦不足貴也。|顛頤，拂經于丘，頤，征凶。|六二征凶，行失類也。|拂頤，貞凶。十年勿用，无攸利。|十年勿用，道大悖也。|顛頤，吉，虎視眈眈，其欲逐逐，无咎。|顛頤之吉，上施光也。|拂經，居貞吉，不可涉大川。|居貞之吉，順以從上也。|由頤，厲，吉，利涉大川。|由頤厲吉，大有慶也。',
28:'棟撓。利有攸往，亨。|大過，大者過也。棟撓，本末弱也。剛過而中，巽而說行，利有攸往，乃亨，大過之時大矣哉。|澤滅木，大過。君子以獨立不懼，遯世无悶。|藉用白茅，无咎。|藉用白茅，柔在下也。|枯楊生稊，老夫得其女妻，无不利。|老夫女妻，過以相與也。|棟橈，凶。|棟橈之凶，不可以有輔也。|棟隆，吉，有它吝。|棟隆之吉，不橈乎下也。|枯楊生華，老婦得其士夫，无咎无譽。|枯楊生華，何可久也；老婦士夫，亦可醜也。|過涉滅頂，凶，无咎。|過涉之凶，不可咎也。',
29:'習坎，有孚，維心亨，行有尚。|習坎，重險也。水流而不盈，行險而不失其信。維心亨，乃以剛中也；行有尚，往有功也。天險不可升也，地險山川丘陵也，王公設險以守其國，險之時用大矣哉。|水洊至，習坎。君子以常德行，習教事。|習坎，入于坎窞，凶。|習坎入坎，失道凶也。|坎，有險，求小得。|求小得，未出中也。|來之坎坎，險且枕，入于坎窞，勿用。|來之坎坎，終无功也。|樽酒，簋貳，用缶，納約自牖，終无咎。|樽酒簋貳，剛柔際也。|坎不盈，祗既平，无咎。|坎不盈，中未大也。|係用黴纆，寘于叢棘，三歲不得，凶。|上六失道，凶三歲也。',
30:'利貞，亨，畜牝牛，吉。|離，麗也。日月麗乎天，百穀草木麗乎土，重明以麗乎正，乃化成天下。柔麗乎中正，故亨，是以畜牝牛吉也。|明兩作，離，大人以繼明照于四方。|履錯然，敬之，无咎。|履錯之敬，以辟咎也。|黃離，元吉。|黃離元吉，得中道也。|日昃之離，不鼓缶而歌，則大耋之嗟，凶。|日昃之離，何可久也。|突如其來如，焚如，死如，棄如。|突如其來如，无所容也。|出涕沱若，戚嗟若，吉。|六五之吉，離王公也。|王用出征，有嘉折首，獲匪其醜，无咎。|王用出征，以正邦也。',
31:'亨，利貞，取女吉。|咸，感也。柔上而剛下，二氣感應以相與，止而說，男下女，是以亨，利貞，取女吉也。天地感而萬物化生，聖人感人心而天下和平。觀其所感，而天地萬物之情可見矣。|山上有澤，咸，君子以虛受人。|咸其拇。|咸其拇，志在外也。|咸其腓，凶，居吉。|雖凶居吉，順不害也。|咸其股，執其隨，往吝。|咸其股，亦不處也，志在隨人，所執下也。|貞吉，悔亡，憧憧往來，朋從爾思。|貞吉悔亡，未感害也；憧憧往來，未光大也。|咸其脢，无悔。|咸其脢，志末也。|咸其輔頰舌。|咸其輔頰舌，滕口說也。',
32:'亨，无咎，利貞，利有攸往。|恒，久也。剛上而柔下，雷風相與，巽而動，剛柔皆應，恒。恒，亨，无咎，利貞，久於其道也。天地之道，恒久而不已也，利有攸往，終則有始也，日月得天而能久照，四時變化而能久成，聖人久於其道而天下化成，觀其所恒而天地萬物之情可見矣。|雷風，恒，君子以立不易方。|浚恒，貞凶，无攸利。|浚恒之凶，始求深也。|悔亡。|九二悔亡，能久中也。|不恒其德，或承之羞，貞吝。|不恒其德，无所容也。|田无禽。|久非其位，安得禽也。|恒其德貞，婦人吉，夫子凶。|婦人貞吉，從一而終也，夫子制義，從婦凶也。|振恒，凶。|振恒在上，大无功也。',
33:'亨，小利貞。|遯亨，遯而亨也。剛當位而應，與時行也。小利貞，浸而長也。遯之時義大矣哉。|天下有山，遯。君子以遠小人，不惡而嚴。|遯尾，厲。勿用有攸往。|遯尾之厲，不往何災也。|執之用黃牛之革，莫之勝說。|執用黃牛，固志也。|係遯，有疾厲，畜臣妾吉。|係遯之厲，有疾憊也；畜臣妾吉，不可大事也。|好遯，君子吉，小人否。|君子好遯，小人否也。|嘉遯，貞吉。|嘉遯貞吉，以正志也。|肥遯无不利。|肥遯，无不利，无所疑也。',
34:'利貞。|大壯，大者壯也，剛以動，故壯。大壯利貞，大者正也。正大而天地之情可見矣。|雷在天上，大壯，君子以非禮弗履。|壯于趾，征凶，有孚。|壯于趾，其孚窮也。|貞吉。|九二貞吉，以中也。|小人用壯，君子用罔。貞厲，羝羊觸藩，羸其角。|小人用壯，君子罔也。|貞吉，悔亡，藩決不羸，壯于大輿之輹。|藩決不羸，尚往也。|喪羊于易，无悔。|喪羊于易，位不當也。|羝羊觸藩，不能退，不能遂，无攸利，艱則吉。|不能退，不能遂，不詳也。艱則吉，咎不長也。',
35:'康侯用錫馬蕃庶，晝日三接。|晉，進也。明出地上，順而麗乎大明，柔進而上行，是以康侯用錫馬蕃庶，晝日三接也。|明出地上，晉。君子以自昭明德。|晉如摧如，貞吉。罔孚裕，无咎。|晉如摧如，獨行正也；裕无咎，未受命也。|晉如愁如，貞吉。受茲介福，于其王母。|受茲介福，以中正也。|眾允，悔亡。|眾允之，志上行也。|晉如鼫鼠，貞厲。|鼫鼠貞厲，位不當也。|悔亡，失得勿恤。往，吉，无不利。|失得勿恤，往有慶也。|晉其角，維用伐邑。厲，吉，无咎，貞吝。|維用伐邑，道未光也。',
36:'利艱貞。|明入地中，明夷。內文明而外柔順，以蒙大難，文王以之。利艱貞，晦其明也。內難而能正其志，箕子以之。|明入地中，明夷。君子以莅眾，用晦而明。|明夷于飛，垂其翼，君子于行，三日不食。有攸往，主人有言。|君子于行，義不食也。|明夷，夷于左股，用拯馬壯吉。|六二之吉，順以則也。|明夷于南狩，得其大首，不可疾貞。|南狩之志，乃得大也。|入于左腹，獲明夷之心，于出門庭。|入于左腹，獲心意也。|箕子之明夷，利貞。|箕子之貞，明不可息也。|不明晦，初登于天，後入于地。|初登于天，照四國也；後入于地，失則也。',
37:'利女貞。|家人，女正位乎內，男正位乎外，男女正，天地之大義也。家人有嚴君焉，父母之謂也。父父，子子，兄兄，弟弟，夫夫，婦婦，而家道正。正家，而天下定矣。|風自火出，家人，君子以言有物，而行有恆。|閑有家，悔亡。|閑有家，志未變也。|无攸遂，在中饋，貞吉。|六二之吉，順以巽也。|家人嗃嗃，悔厲吉，婦子嘻嘻，終吝。|家人嗃嗃，未失也；婦子嘻嘻，失家節也。|富家，大吉。|富家大吉，順在位也。|王假有家，勿恤，吉。|王假有家，交相愛也。|有孚，威如，終吉。|威如之吉，反身之謂也。',
38:'小事吉。|睽，火動而上，澤動而下，二女同居，其志不同行。說而麗乎明，柔進而上行，得中而應乎剛，是以小事吉。天地睽而其事同也，男女睽而其志通也，萬物睽而其事類也，睽之時用大矣哉。|上火下澤，睽，君子以同而異。|悔亡，喪馬，勿逐，自復。見惡人，无咎。|見惡人，以辟咎也。|遇主于巷，无咎。|遇主于巷，未失道也。|見輿曳，其牛掣，其人天且劓，无初有終。|見輿曳，位不當也，无初有終，遇剛也。|睽孤，遇元夫。交孚，厲无咎。|交孚无咎，志行也。|悔亡。厥宗噬膚，往何咎。|厥宗噬膚，往有慶也。|睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾。往，遇雨則吉。|遇雨之吉，群疑亡也。',
39:'利西南，不利東北，利見大人，貞吉。|蹇，難也，險在前也。見險而能止，知矣哉。蹇，利西南，往得中也；不利東北，其道窮也。利見大人，往有功也；當位貞吉，以正邦也。蹇之時用大矣哉。|山上有水，蹇，君子以反身脩德。|往蹇，來譽。|往蹇來譽，宜待也。|王臣蹇蹇，匪躬之故。|王臣蹇蹇，終无尤也。|往蹇，來反。|往蹇來反，內喜之也。|往蹇，來連。|往蹇來連，當位實也。|大蹇，朋來。|大蹇朋來，以中節也。|往蹇，來碩，吉，利見大人。|往蹇來碩，志在內也；利見大人，以從貴也。',
40:'利西南，无所往，其來復。吉，有攸往，夙吉。|解，險以動，動而免乎險，解。解，利西南，往得眾也；其來復吉，乃得中也；有攸往夙吉，往有功也。天地解而雷雨作，雷雨作而百果草木皆甲坼，解之時大矣哉。|雷雨作，解。君子以赦過宥罪。|无咎。|剛柔之際，義无咎也。|田獲三狐，得黃矢，貞吉。|九二貞吉，得中道也。|負且乘，致寇至，貞吝。|負且乘，亦可醜也，自我致戎，又誰咎也。|解而拇，朋至斯孚。|解而拇，未當位也。|君子維有解，吉，有孚于小人。|君子有解，小人退也。|公用射隼于高墉之上，獲之，无不利。|公用射隼，以解悖也。',
41:'有孚，元吉，无咎，可貞，利有攸往。曷之用，二簋可用享。|損，損下益上，其道上行，損而有孚，元吉。无咎，可貞，利有攸往，曷之用，二簋可用享，二簋應有時，損剛益柔有時，損益盈虛，與時偕行。|山下有澤，損，君子以懲忿窒欲。|已事遄往，无咎，酌損之。|已事遄往，尚合志也。|利貞，征凶。弗損，益之。|九二利貞，中以為志也。|三人行，則損一人，一人行，則得其友。|一人行，三則疑也。|損其疾，使遄有喜，无咎。|損其疾，亦可喜也。|或益之，十朋之龜，弗克違，元吉。|六五元吉，自上祐也。|弗損，益之，无咎，貞吉，利有攸往，得臣无家。|弗損益之，大得志也。',
42:'利有攸往，利涉大川。|益，損上益下，民說无疆，自上下下，其道大光。利有攸往，中正有慶；利涉大川，木道乃行。益動而巽，日進无疆，天施地生，其益无方，凡益之道，與時偕行。|風雷，益，君子以見善則遷，有過則改。|利用為大作，元吉，无咎。|元吉，无咎，下不厚事也。|或益之，十朋之龜，弗克違，永貞吉。王用享于帝，吉。|或益之，自外來也。|益之，用凶事，无咎。有孚，中行告公，用圭。|益用凶事，固有之也。|中行，告公從，利用為依遷國。|告公從，以益志也。|有孚，惠心，勿問元吉。有孚，惠我德。|有孚惠心，勿問之矣；惠我德，大得志也。|莫益之，或擊之，立心勿恆，凶。|莫益之，偏辭也；或擊之，自外來也。',
43:'揚于王庭，孚號有厲。告自邑，不利即戎，利有攸往。|夬，決也，剛決柔也。健而說，決而和。揚于王庭，柔乘五剛也；孚號有厲，其危乃光也；告自邑，不利即戎，所尚乃窮也；利有攸往，剛長乃終也。|澤上於天，夬。君子以施祿及下，居德則忌。|壯于前趾，往不勝，為咎。|不勝而往，咎也。|惕號，莫夜有戎，勿恤。|有戎勿恤，得中道也。|壯于頄，有凶。君子夬夬，獨行，遇雨若濡。有慍，无咎。|君子夬夬，終无咎也。|臀无膚，其行次且，牽羊悔亡，聞言不信。|其行次且，位不當也，聞言不信，聰不明也。|莧陸夬夬，中行无咎。|中行无咎，中未光也。|无號，終有凶。|无號之凶，終不可長也。',
44:'女壯，勿用取女。|姤，遇也，柔遇剛也。勿用取女，不可與長也。天地相遇，品物咸章也；剛遇中正，天下大行也，姤之時義大矣哉。|天下有風，姤，后以施命誥四方。|繫于金柅，貞吉。有攸往，見凶。羸豕孚蹢躅。|繫于金柅，柔道牽也。|包有魚，无咎，不利賓。|包有魚，義不及賓也。|臀无膚，其行次且，厲，无大咎。|其行次且，行未牽也。|包无魚，起凶。|无魚之凶，遠民也。|以杞包瓜，含章，有隕自天。|九五含章，中正也，有隕自天，志不舍命也。|姤其角，吝，无咎。|姤其角，上窮吝也。',
45:'亨。王假有廟，利見大人，亨，利貞。用大牲，吉。利有攸往。|萃，聚也。順以說，剛中而應，故聚也。王假有廟，致孝享也；利見大人，亨，聚以正也；用大牲，吉，利有攸往，順天命也。觀其所聚，而天地萬物之情可見矣。|澤上於地，萃，君子以除戎器，戒不虞。|有孚不終，乃亂乃萃，若號。一握為笑，勿恤，往，无咎。|乃亂乃萃，其志亂也。|引吉，无咎，孚乃利用禴。|引吉无咎，中未變也。|萃如嗟如，无攸利。往无咎，小吝。|往无咎，上巽也。|大吉，无咎。|大吉无咎，位不當也。|萃有位，无咎，匪孚。元永貞，悔亡。|萃有位，志未光也。|齎咨涕洟，无咎。|齎咨涕洟，未安上也。',
46:'元亨。用見大人，勿恤。南征吉。|柔以時升，巽而順，剛中而應，是以大亨；用見大人，勿恤，有慶也；南征吉，志行也。|地中生木，升。君子以順德，積小以高大。|允升，大吉。|允升大吉，上合志也。|孚乃利用禴，无咎。|九二之孚，有喜也。|升虛邑。|升虛邑，无所疑也。|王用亨于岐山，吉，无咎。|王用亨于岐山，順事也。|貞吉，升階。|貞吉升階，大得志也。|冥升，利于不息之貞。|冥升在上，消不富也。',
47:'亨。貞大人吉，无咎。有言不信。|困，剛揜也。險以說，困而不失其所亨，其唯君子乎。貞大人吉，以剛中也；有言不信，尚口乃窮也。|澤无水，困。君子以致命遂志。|臀困于株木，入于幽谷，三歲不覿。|入于幽谷，幽不明也。|困于酒食，朱紱方來，利用享祀，征凶，无咎。|困于酒食，中有慶也。|困于石，據于蒺蔾，入于其宮，不見其妻，凶。|據于蒺蔾，乘剛也，入于其宮，不見其妻，不祥也。|來徐徐，困于金車。吝，有終。|來徐徐，志在下也。雖不當位，有與也。|劓刖，困于赤紱，乃徐有說。利用祭祀。|劓刖，志未得也；乃徐有說，以中直也；利用祭祀，受福也。|困于葛藟，于臲卼，曰動悔有悔，征吉。|困于葛藟，未當也；動悔有悔，吉行也。',
48:'改邑不改井，无喪无得，往來井井。汔至亦未繘井，羸其瓶，凶。|巽乎水而上水，井，井養而不窮也。改邑不改井，乃以剛中也；汔至亦未繘井，未有功也；羸其瓶，是以凶也。|木上有水，井，君子以勞民勸相。|井泥不食，舊井无禽。|井泥不食，下也；舊井无禽，時舍也。|井谷射鮒，甕敝漏。|井谷射鮒，无與也。|井渫不食，為我心惻，可用汲。王明，並受其福。|井渫不食，行惻也；求王明，受福也。|井甃无咎。|井甃无咎，脩井也。|井洌，寒泉，食。|寒泉之食，中正也。|井收，勿幕，有孚，元吉。|元吉在上，大成也。',
49:'已日乃孚，元亨，利貞，悔亡。|革，水火相息，二女同居，其志不相得，曰革。已日乃孚，革而信之，文明以說，大亨以正，革而當，其悔乃亡。天地革而四時成，湯武革命，順乎天而應乎人，革之時大矣哉。|澤中有火，革，君子以治曆明時。|鞏用黃牛之革。|鞏用黃牛，不可以有為也。|已日乃革之，征吉，无咎。|巳日革之，行有嘉也。|征凶，貞厲，革言三就，有孚。|革言三就，又何之矣。|悔亡，有孚改命，吉。|改命之吉，信志也。|大人虎變，未占有孚。|大人虎變，其文炳也。|君子豹變，小人革面，征凶，居貞吉。|君子豹變，其文蔚也；小人革面，順以從君也。',
50:'元吉，亨。|鼎，象也。以木巽火，亨飪也。聖人亨以享上帝，而大亨以養聖賢。巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。|木上有火，鼎，君子以正位凝命。|鼎顛趾，利出否，得妾以其子，无咎。|鼎顛趾，未悖也。利出否，以從貴也。|鼎有實，我仇有疾，不我能即，吉。|鼎有實，慎所之也；我仇有疾，終无尤也。|鼎耳革，其行塞，雉膏不食。方雨虧悔，終吉。|鼎耳革，失其義也。|鼎折足，覆公餗，其形渥，凶。|覆公餗，信如何也。|鼎黃耳金鉉，利貞。|鼎黃耳，中以為實也。|鼎玉鉉，大吉，无不利。|玉鉉在上，剛柔節也。',
51:'亨。震來虩虩，笑言啞啞，震驚百里，不喪匕鬯。|震，亨。震來虩虩，恐致福也；笑言啞啞，後有則也；震驚百里，驚遠而懼邇也，出可以守宗廟社稷，以為祭主也。|洊雷震，君子以恐懼脩省。|震來虩虩，後笑言啞啞，吉。|震來虩虩，恐致福也；笑言啞啞，後有則也。|震來厲，億喪貝，躋于九陵。勿逐，七日得。|震來厲，乘剛也。|震蘇蘇，震行无眚。|震蘇蘇，位不當也。|震遂泥。|震遂泥，未光也。|震往來厲，億无喪，有事。|震往來厲，危行也，其事在中，大无喪也。|震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言。|震索索，中未得也；雖凶无咎，畏鄰戒也。',
52:'艮其背，不獲其身；行其庭，不見其人。无咎。|艮，止也，時止則止，時行則行，動靜不失其時，其道光明。艮其止，止其所也。上下敵應，不相與也，是以不獲其身。行其庭不見其人，无咎也。|兼山，艮，君子以思不出其位。|艮其趾，无咎，利永貞。|艮其趾，未失正也。|艮其腓，不拯其隨，其心不快。|不拯其隨，未退聽也。|艮其限，列其夤，厲薰心。|艮其限，危薰心也。|艮其身，无咎。|艮其身，止諸躬也。|艮其輔，言有序，悔亡。|艮其輔，以中正也。|敦艮，吉。|敦艮之吉，以厚終也。',
53:'女歸吉，利貞。|漸，之進也，女歸吉也。進得位，往有功也，進以正，可以正邦也。其位，剛得中也。止而巽，動不窮也。|山上有木，漸，君子以居賢德善俗。|鴻漸于干，小子厲，有言，无咎。|小子之厲，義无咎也。|鴻漸于磐，飲食衎衎，吉。|飲食衎衎，不素飽也。|鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。|夫征不復，離群醜也；婦孕不育，失其道也；利用禦寇，順相保也。|鴻漸于木，或得其桷，无咎。|或得其桷，順以巽也。|鴻漸于陵，婦三歲不孕，終莫之勝，吉。|終莫之勝，吉，得所願也。|鴻漸于陸，其羽可用為儀，吉。|其羽可用為儀，吉，不可亂也。',
54:'征凶，无攸利。|歸妹，天地之大義也。天地不交，而萬物不興。歸妹，人之終始也，說以動，所歸妹也。征凶，位不當也；无攸利，柔乘剛也。|澤上有雷，歸妹。君子以永終知敝。|歸妹以娣，跛能履，征吉。|歸妹以娣，以恒也；跛能履，吉，相承也。|眇能視，利幽人之貞。|利幽人之貞，未變常也。|歸妹以須，反歸以娣。|歸妹以須，未當也。|歸妹愆期，遲歸有時。|愆期之志，有待而行也。|帝乙歸妹，其君之袂，不如其娣之袂良。月幾望，吉。|帝乙歸妹，不如其娣之袂良也，其位在中，以貴行也。|女承筐无實，士刲羊无血，无攸利。|上六无實，承虛筐也。',
55:'亨，王假之。勿憂，宜日中。|豐，大也。明以動，故豐。王假之，尚大也；勿憂，宜日中，宜照天下也。日中則昃，月盈則食，天地盈虛，與時消息，而況於人乎？況於鬼神乎？|雷電皆至，豐，君子以折獄致刑。|遇其配主，雖旬，无咎，往有尚。|雖旬无咎，過旬災也。|豐其蔀，日中見斗。往得疑疾，有孚發若，吉。|有孚發若，信以發志也。|豐其沛，日中見沬。折其右肱，无咎。|豐其沛，不可大事也；折其右肱，終不可用也。|豐其蔀，日中見斗，遇其夷主，吉。|豐其蔀，位不當也；日中見斗，幽不明也；遇其夷主，吉行也。|來章，有慶譽，吉。|六五之吉，有慶也。|豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。|豐其屋，天際翔也；闚其戶，闃其无人，自藏也。',
56:'小亨，旅貞吉。|旅，小亨，柔得中乎外而順乎剛，止而麗乎明，是以小亨，旅貞吉也，旅之時義大矣哉。|山上有火，旅，君子以明慎用刑而不留獄。|旅瑣瑣，斯其所取災。|旅瑣瑣，志窮災也。|旅即次，懷其資，得童僕貞。|得童僕貞，終无尤也。|旅焚其次，喪其童僕，貞，厲。|旅焚其次，亦以傷矣。以旅與下，其義喪也。|旅于處，得其資斧，我心不快。|旅于處，未得位也；得其資斧，心未快也。|射雉一矢，亡，終以譽命。|終以譽命，上逮也。|鳥焚其巢，旅人先笑後號咷，喪牛于易，凶。|以旅在上，其義焚也；喪牛于易，終莫之聞也。',
57:'小亨，利有攸往，利見大人。|重巽以申命，剛巽乎中正而志行，柔皆順乎剛，是以小亨，利有攸往，利見大人。|隨風，巽，君子以申命行事。|進退，利武人之貞。|進退，志疑也；利武人之貞，志治也。|巽在床下，用史巫，紛若，吉，无咎。|紛若之吉，得中也。|頻巽，吝。|頻巽之吝，志窮也。|悔亡，田獲三品。|田獲三品，有功也。|貞吉，悔亡，无不利。无初有終，先庚三日，後庚三日，吉。|九五之吉，位正中也。|巽在床下，喪其資斧，貞凶。|巽在床下，上窮也；喪其資斧，正乎凶也。',
58:'亨，利貞。|兌，說也。剛中而柔外，說以利貞，是以順乎天而應乎人。說以先民，民忘其勞，說以犯難，民忘其死，說之大，民勸矣哉。|麗澤，兌。君子以朋友講習。|和兌吉。|和兌之吉，行未疑也。|孚兌，吉，悔亡。|孚兌之吉，信志也。|來兌，凶。|來兌之凶，位不當也。|商兌未寧，介疾有喜。|九四之喜，有慶也。|孚于剝，有厲。|孚于剝，位正當也。|引兌。|上六引兌，未光也。',
59:'亨。王假有廟，利涉大川，利貞。|渙亨，剛來而不窮，柔得位乎外而上同。王假有廟，王乃在中也。利涉大川，乘木有功也。|風行水上，渙，先王以享于帝，立廟。|用拯馬壯，吉。|初六之吉，順也。|渙奔其机，悔亡。|渙奔其机，得願也。|渙其躬，无悔。|渙其躬，志在外也。|渙其群，元吉，渙有丘，匪夷所思。|渙其群，元吉，光大也。|渙汗其大號，渙王居，无咎。|王居无咎，正位也。|渙其血，去逖出，无咎。|渙其血，遠害也。',
60:'亨。苦節，不可貞。|節亨，剛柔分而剛得中。苦節不可貞，其道窮也。說以行險，當位以節，中正以通。天地節而四時成，節以制度，不傷財，不害民。|澤上有水，節。君子以制數度，議德行。|不出戶庭，无咎。|不出戶庭，知通塞也。|不出門庭，凶。|不出門庭凶，失時極也。|不節若，則嗟若，无咎。|不節之嗟，又誰咎也。|安節，亨。|安節之亨，承上道也。|甘節，吉，往有尚。|甘節之吉，居位中也。|苦節，貞凶，悔亡。|苦節貞凶，其道窮也。',
61:'豚魚吉，利涉大川，利貞。|中孚，柔在內而剛得中，說而巽，孚，乃化邦也。豚魚吉，信及豚魚也；利涉大川，乘木舟虛也；中孚以利貞，乃應乎天也。|澤上有風，中孚，君子以議獄緩死。|虞吉，有它不燕。|初九虞吉，志未變也。|鶴鳴在陰，其子和之；我有好爵，吾與爾靡之。|其子和之，中心願也。|得敵，或鼓或罷，或泣或歌。|或鼓或罷，位不當也。|月幾望，馬匹亡，无咎。|馬匹亡，絕類上也。|有孚攣如，无咎。|有孚攣如，位正當也。|翰音登于天，貞凶。|翰音登于天，何可長也。',
62:'亨，利貞。可小事，不可大事。飛鳥遺之音，不宜上，宜下。大吉。|小過，小者過而亨也，過以利貞，與時行也。柔得中，是以小事吉也；剛失位而不中，是以不可大事也。有飛鳥之象焉，飛鳥遺之音，不宜上，宜下，大吉，上逆而下順也。|山上有雷，小過。君子以行過乎恭，喪過乎哀，用過乎儉。|飛鳥以凶。|飛鳥以凶，不可如何也。|過其祖，遇其妣，不及其君，遇其臣，无咎。|不及其君，臣不可過也。|弗過防之，從或戕之，凶。|從或戕之，凶如何也。|无咎，弗過遇之，往厲必戒，勿用永貞。|弗過遇之，位不當也；往厲必戒，終不可長也。|密雲不雨，自我西郊，公弋取彼在穴。|密雲不雨，已上也。|弗遇過之，飛鳥離之，凶，是謂災眚。|弗遇過之，已亢也。',
63:'亨小，利貞。初吉，終亂。|既濟亨小者，亨也；利貞，剛柔正而位當也。初吉，柔得中也，終止則亂，其道窮也。|水在火上，既濟，君子以思患而豫防之。|曳其輪，濡其尾，无咎。|曳其輪，義无咎也。|婦喪其茀，勿逐，七日得。|七日得，以中道也。|高宗伐鬼方，三年克之，小人勿用。|三年克之，憊也。|繻有衣袽，終日戒。|終日戒，有所疑也。|東鄰殺牛，不如西鄰之禴祭，實受其福。|東鄰殺牛，不如西鄰之時也，實受其福，吉大來也。|濡其首，厲。|濡其首厲，何可久也。',
64:'亨。小狐汔濟，濡其尾，无攸利。|未濟亨，柔得中也；小狐汔濟，未出中也；濡其尾，无攸利，不續終也，雖不當位，剛柔應也。|火在水上，未濟，君子以慎辨物居方。|濡其尾，吝。|濡其尾，亦不知極也。|曳其輪，貞吉。|九二貞吉，中以行正也。|未濟，征凶，利涉大川。|未濟征凶，位不當也。|貞吉，悔亡，震用伐鬼方，三年有賞于大國。|貞吉悔亡，志行也。|貞吉无悔，君子之光，有孚，吉。|君子之光，其暉吉也。|有孚于飲酒，无咎。濡其首，有孚，失是。|飲酒濡首，亦不知節也。'};
const WY={"1": ["文言曰：元者善之長也，亨者嘉之會也，利者義之和也，貞者事之幹也。君子，體仁足以長人，嘉會足以合禮，利物足以和義，貞固足以幹事，君子行此四德者，故曰：乾，元亨利貞。", "初九曰：潛龍勿用，何謂也？子曰，龍德而隱者也，不易乎世，不成乎名，遯世無悶，不見是而無悶，樂則行之，憂則違之，確乎其不可拔，潛龍也。", "九二曰：見龍在田，利見大人，何謂也？子曰，龍德而正中者也。庸言之信，庸行之謹，閑邪存其誠，善世而不伐，德博而化。易曰，見龍在田，利見大人，君德也。", "九三曰：君子終日乾乾，夕惕若厲，無咎，何謂也？子曰，君子進德修業。忠信，所以進德也，修辭立其誠，所以居業也，知至至之可與幾也，知終終之可與存義也。是故居上位而不驕，在下位而不憂。故乾乾因其時而惕，雖危無咎矣。", "九四曰：或躍在淵，无咎，何謂也？子曰，上下无常，非為邪也。進退无恆，非離群也。君子進德修業，欲及時也，故无咎。", "九五曰：飛龍在天，利見大人，何謂也？子曰，同聲相應，同氣相求。水流濕，火就燥，雲從龍，風從虎。聖人作而萬物覩，本乎天者親上，本乎地者親下，則各從其類也。", "上九曰，亢龍有悔，何謂也？子曰，貴而无位，高而无民，賢人在下位而无輔，是以動而有悔也。", "潛龍勿用，下也；見龍在田，時舍也；終日乾乾，行事也；或躍在淵，自試也；飛龍在天，上治也；亢龍有悔，窮之災也；乾元用九，天下治也。", "潛龍勿用，陽氣潛藏；見龍在田，天下文明；終日乾乾，與時偕行；或躍在淵，乾道乃革；飛龍在天，乃位乎天德；亢龍有悔，與時偕極；乾元用九，乃見天則。", "乾元者，始而亨者也；利貞者，性情也。乾始能以美利利天下，不言所利，大矣哉。大哉乾乎，剛健中正，純粹精也；六爻發揮，旁通情也；時乘六龍，以御天也；雲行雨施，天下平也。", "君子以成德為行，日可見之行也，潛之為言也，隱而未見，行而未成，是以君子弗用也。君子學以聚之，問以辨之，寬以居之，仁以行之。", "易曰，見龍在田，利見大人，君德也。九三，重剛而不中，上不在天，下不在田，故乾乾因其時而惕，雖危无咎矣。九四，重剛而不中，上不在天，下不在田，中不在人，故或之。或之者疑之也，故无咎，夫大人者，與天地合其德，與日月合其明，與四時合其序，與鬼神合其吉凶。先天而天弗違，後天而奉天時，天且弗違，而況於人乎？況於鬼神乎？", "亢之為言也，知進而不知退，知存而不知亡，知得而不知喪，其唯聖人乎！知進退存亡而不失其正者，其唯聖人乎。"], "2": ["文言曰：坤至柔而動也剛，至靜而德方，後得主而有常，含萬物而化光。坤道其順乎，承天而時行。積善之家，必有餘慶；積不善之家，必有餘殃。臣弒其君，子弒其父，非一朝一夕之故，其所由來者漸矣，由辯之不早辯也。易曰，履霜堅冰至，蓋言順也。直，其正也；方，其義也。君子敬以直內，義以方外，敬義立而德不孤。直方大，不習无不利，則不疑其所行也。陰雖有美，含之以從王事，弗敢成也。地道也，妻道也，臣道也。地道无成，而代有終也，天地變化，草木蕃，天地閉，賢人隱。易曰：括囊，无咎无譽，蓋言謹也。君子黃中通理，正位居體，美在其中，而暢於四支，發於事業，美之至也。陰疑於陽必戰，為其嫌於无陽也，故稱龍焉；猶未離其類也，故稱血焉。夫玄黃者，天地之雜也，天玄而地黃。"]};

 const a=s.split('|'),h=(t,x)=>`<p style="margin:6px 0"><b>${t}</b>　${x}</p>`;
 let r=h('卦辭',a[0])+h('彖傳',a[1])+h('大象',a[2]);
 for(let i=5;i>=0;i--){r+=`<p style="margin:6px 0"><b>${yl(i,ln[i])}</b>　${a[3+2*i]}<br><span class="meta">象曰：${a[4+2*i]}</span></p>`;

 if(WY[n])r+='<details style="margin:8px 0"><summary><b>文言傳</b></summary>'+WY[n].map(p=>`<p style="margin:6px 0;font-size:.92rem">${p}</p>`).join('')+'</details>';return r+'<p class="meta">資料來源：你提供的《周易》原文檔，用字依原檔（如「旡」「无」「無」未統一）。</p>'}
function relBoard(ti,yi,hl,hu,bi,low){
 const col={木:'#4f8a4b',火:'#c0392b',土:'#b08a3c',金:'#8a8a8a',水:'#3d6fa8'},kc={生:['mg','#3f8f4a'],剋:['mk','#c0392b'],比和:['mh','#8a7a5a']},cx=180,cy=92,nm=i=>T[i].n+'('+T[i].e+')';
 const rr=(ux,uy)=>1/Math.sqrt((ux/38)**2+(uy/22)**2)+3;
 const node=(lab,i,x,y)=>`<ellipse cx="${x}" cy="${y}" rx="38" ry="22" fill="${col[T[i].e]}" fill-opacity=".22" stroke="${col[T[i].e]}"/><text x="${x}" y="${y-1}" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">${T[i].n}${T[i].e}</text><text x="${x}" y="${y+13}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".7">${lab}</text>`;
 let g=node('體',ti,cx,cy),ls='';
 [['用',yi,62,36],['下互',hl,62,148],['上互',hu,298,36],['變卦',bi,298,148]].forEach(([lab,b,x,y])=>{
  const e1=T[ti].e,e2=T[b].e,X=lab+nm(b),S='體'+nm(ti);let k,fw,tx;
  if(e1===e2){k='比和';fw=null;tx=`${S} 與${X} 比和`}
  else if(GEN[e1]===e2){k='生';fw=true;tx=`${S} 生 ${X}`}
  else if(GEN[e2]===e1){k='生';fw=false;tx=`${X} 生 ${S}`}
  else if(KE[e1]===e2){k='剋';fw=true;tx=`${S} 剋 ${X}`}
  else{k='剋';fw=false;tx=`${X} 剋 ${S}`}
  ls+=`<li>${tx}</li>`;
  const dx=x-cx,dy=y-cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,r=rr(ux,uy);let p=[cx+ux*r,cy+uy*r,x-ux*r,y-uy*r];if(fw===false)p=[p[2],p[3],p[0],p[1]];
  const [mk,c]=kc[k];
  g+=node(lab,b,x,y)+`<line x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}" stroke="${c}" stroke-width="2" marker-end="url(#${mk})"${fw===null?` marker-start="url(#${mk})"`:''}/><text x="${(p[0]+p[2])/2}" y="${(p[1]+p[3])/2+4}" text-anchor="middle" font-size="12" font-weight="700" fill="${c}" stroke="var(--card)" stroke-width="3" paint-order="stroke">${k}</text>`});
 const mkr=(id,c)=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;
 return `<svg viewBox="0 0 360 184" style="width:100%;max-width:420px;display:block;margin:0 auto"><defs>${mkr('mg','#3f8f4a')}${mkr('mk','#c0392b')}${mkr('mh','#8a7a5a')}</defs>${g}</svg><ul class="rel" style="margin:6px 0 0">${ls}</ul>`}

function hlz(){const t=$('tz').value,i=Z.indexOf(t),c=i<0?'':Z[(i+6)%12],h=i<0?'':HE[i];
 document.querySelectorAll('.ye[data-z]').forEach(e=>{const z=e.dataset.z;e.className='ye'+(t&&z===t&&$('tv').checked?' v':t&&z===c&&$('tc').checked?' c':t&&z===h&&$('th').checked?' h':'')})}

 for(let k=0;k<30;k++){const l2=js.next(10).getLunar(),nj=l2.getNextJie().getSolar(),z=l2.getEightChar().getMonthZhi(),e=nj.next(-1),yr=js.getYear()!==py?js.getYear()+'年 ':'';py=js.getYear();mh+=c(`${yr}<b>${z}</b> ${js.getMonth()}/${js.getDay()}~${e.getMonth()}/${e.getDay()}`,z);js=nj}
 const y0=gz(y)===ec.getYear()?y:y-1;
 for(let k=0;k<30;k++){const g=gz(y0+k);yh+=c(`${y0+k} <b>${g}</b>`,g[1])}
 const lb=(id,cl,t)=>`<label style="display:inline-flex;gap:4px;align-items:center;margin:0 0 0 8px;flex:0 0 auto"><input type="checkbox" id="${id}" checked onchange="hlz()" style="width:auto"><span class="ye ${cl}">${t}</span></label>`;
 return `<div class="card" id="yq"><h2>應期參考表</h2><div class="meta">先選應期單位（日／月／年），再選目標地支，標示值、沖、合。月建以節氣為界，年以立春為界，交節當日以交節時刻為準。</div><div class="row" style="align-items:center;margin:6px 0"><select id="tu" onchange="sw()" style="flex:0 0 6.5em"><option value="0">單位：日</option><option value="1">單位：月</option><option value="2">單位：年</option></select><select id="tz" onchange="hlz()" style="flex:0 0 8em"><option value="">目標地支</option>${[...Z].map(z=>`<option>${z}</option>`).join('')}</select>${lb('tv','v','值')}${lb('tc','c','沖')}${lb('th','h','合')}</div><div class="st">日支表（自起卦日起 30 天）</div><div class="yg" style="grid-template-columns:repeat(auto-fill,minmax(70px,1fr))">${dh}</div><div class="st">月建對照（節氣月，30 個月）</div><div class="yg" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${mh}</div><div class="st">年表（30 年）</div><div class="yg" style="grid-template-columns:repeat(auto-fill,minmax(86px,1fr))">${yh}</div><p class="meta">僅供查詢，不判斷吉凶。</p></div>`}
function run(){
 const v=$('dt').value;if(!v){alert('請輸入起卦時間');return}
 const [y,mo,d]=v.slice(0,10).split('-').map(Number),[h,mi]=v.slice(11,16).split(':').map(Number);
 const sol=Solar.fromYmdHms(y,mo,d,h,mi,0),lu=sol.getLunar(),ec=lu.getEightChar();ec.setSect(2);
 const hi=Math.floor((h+1)/2)%12,hn=hi+1,steps=[];let up,lo,mv;const CU=mode==='cu'?cuPrep():null;
 if(mode==='time'){
  const yz=lu.getYearZhi(),yn=Z.indexOf(yz)+1,lm=Math.abs(lu.getMonth()),ld=lu.getDay(),s1=yn+lm+ld,s2=s1+hn;
  up=m8(s1);lo=m8(s2);mv=m6(s2);
  steps.push(`農曆年支 ${yz}＝${yn}，農曆月 ${lm}${lu.getMonth()<0?'（閏月）':''}，農曆日 ${ld}，時支 ${Z[hi]}＝${hn}`,`上卦：(${yn}+${lm}+${ld}) = ${s1}，${s1} ÷ 8 餘 ${s1%8}（餘 0 取 8）→ ${T[up-1].n}`,`下卦：(${s1}+${hn}) = ${s2}，${s2} ÷ 8 餘 ${s2%8} → ${T[lo-1].n}`,`動爻：${s2} ÷ 6 餘 ${s2%6}（餘 0 取 6）→ 第 ${mv} 爻`);
 }else if(mode==='num'){
  const a=parseInt($('n1').value),b=parseInt($('n2').value);
  if(!(a>0&&b>0)){alert('請輸入兩組正整數，或按「電腦亂數產生」');return}
  up=m8(a);lo=m8(b);const s=a+b+hn;mv=m6(s);
  steps.push(`上卦：${a} ÷ 8 餘 ${a%8}（餘 0 取 8）→ ${T[up-1].n}`,`下卦：${b} ÷ 8 餘 ${b%8} → ${T[lo-1].n}`,`動爻：(${a}+${b}+時支${Z[hi]}${hn}) = ${s}，÷ 6 餘 ${s%6}（餘 0 取 6）→ 第 ${mv} 爻`);
 }else{
  up=+$('hu').value;lo=+$('hl').value;const o=$('hm').value;
  steps.push(`手動指定：上卦 ${T[up-1].n}（${up}），下卦 ${T[lo-1].n}（${lo}）`);
  if(o==='a'){const s=up+lo+hn;mv=m6(s);steps.push(`動爻：(${up}+${lo}+時支${Z[hi]}${hn}) = ${s}，÷ 6 餘 ${s%6}（餘 0 取 6）→ 第 ${mv} 爻`)}
  else{mv=+o;steps.push(mv?`動爻：手動指定第 ${mv} 爻`:'無動爻（靜卦）')}
 }
 if(CU){steps.length=0;steps.push(...CU.steps);up=CU.up;lo=CU.lo;mv=CU.mv}const U=up-1,L=lo-1,lines=[...T[L].l,...T[U].l];
 const hl=CU?CU.hl:[lines[1],lines[2],lines[3]],hu=CU?CU.hu:[lines[2],lines[3],lines[4]],HL=triIdx(hl),HU=triIdx(hu);
 const bl=CU?CU.bl.slice():lines.slice();if(mv&&!CU)bl[mv-1]=bl[mv-1]?0:1;
 let ty='';
 if(mv){const yongLow=mv<=3,ti=yongLow?U:L,yi=yongLow?L:U,bi=triIdx(yongLow?bl.slice(0,3):bl.slice(3));
  ty=`<div class="card"><h2>體用與五行生剋</h2><p>動爻在${yongLow?'下':'上'}卦：<b>${T[yi].n}為用</b>，<b>${T[ti].n}為體</b></p><ul class="rel"><li>${rel(ti,yi,'用')}</li><li>${rel(ti,HL,'下互'+T[HL].n)}</li><li>${rel(ti,HU,'上互'+T[HU].n)}</li><li>${rel(ti,bi,'變卦之'+T[bi].n)}</li></ul><p class="meta">僅呈現五行計算結果，不判斷吉凶。</p></div>`;
 }else ty='<div class="card"><h2>體用</h2><p class="meta">靜卦無動爻，不分體用。</p></div>';
 ty=mv?(()=>{const lw=mv<=3,ti=lw?U:L,yi=lw?L:U,bi=triIdx(lw?bl.slice(0,3):bl.slice(3));return relBoard(ti,yi,HL,HU,bi,lw)})():'<p class="meta" style="text-align:center">靜卦，無動爻，不分體用。</p>';
 const pj=lu.getPrevJieQi(),nj=lu.getNextJieQi();
 const tcard=`<div class="card"><h2>起卦時間與四柱</h2><div class="meta">國曆 <b>${sol.toYmdHms().slice(0,16)}</b>（台灣時間）<br>農曆 <b>${lu.getYearInChinese()}年${lu.getMonthInChinese()}月${lu.getDayInChinese()}</b>　時辰 <b>${Z[hi]}時</b></div><div class="pil"><div><small>年柱</small><b>${ec.getYear()}</b></div><div><small>月柱</small><b>${ec.getMonth()}</b></div><div><small>日柱</small><b>${ec.getDay()}</b></div><div><small>時柱</small><b>${ec.getTime()}</b></div></div><div class="meta">月建 <b>${ec.getMonth().slice(1)}</b>　日辰 <b>${ec.getDay().slice(1)}</b>　日旬空 <b>${lu.getDayXunKong()}</b>　時旬空 <b>${lu.getTimeXunKong()}</b><br>上一節氣 <b>${pj.getName()}</b> ${pj.getSolar().toYmdHms().slice(0,16)}　下一節氣 <b>${nj.getName()}</b> ${nj.getSolar().toYmdHms().slice(0,16)}</div></div>
 `;const body=`<div class="card"><h2>卦盤${mv?`（動爻：第 ${mv} 爻）`:'（靜卦）'}</h2><div class="hex">${hexCard('本卦',lines,mv,'動')}${hexCard('互卦',[...hl,...hu],0,'')}${hexCard('變卦',bl,mv,'變')}</div><p class="meta" style="text-align:center">${(()=>{const s=[[U,L],[HU,HL],[triIdx(bl.slice(3)),triIdx(bl.slice(0,3))]].map(([u,l])=>u+l+2);return `先天數合計：本卦 ${s[0]}＋互卦 ${s[1]}＋變卦 ${s[2]}＝<b>${s[0]+s[1]+s[2]}</b>`})()}</p><p class="meta" style="text-align:center">點擊卦名或上下卦查看資料</p>${ty}</div>
 ${steps.filter(s=>s.startsWith('⚠')).map(s=>`<div class="card"><p class="meta" style="margin:0">${s}</p></div>`).join('')}`;
 $('out').innerHTML=tcard+body+yqTable(y,mo,d,ec);
 sw();$('out').scrollIntoView({behavior:'smooth'});
}
</script>
